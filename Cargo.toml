[package]
name = "wwwidgets"
version = "0.1.0"
edition = "2024"

[dependencies]
gio = { version = "0.22.10", features = ["v2_80"] }
glib-unix = "0.22.8"
gtk4 = { version = "0.11.5", features = ["v4_18"] }
gtk4-layer-shell = "0.8.1"
json5 = "1.3.1"
lexopt = "0.3.2"
libpulse-binding = "2.30.1"
libpulse-glib-binding = "2.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
traccia = "4.1.2"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
webkit6 = "0.6.1"
