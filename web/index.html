<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Web App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Hello from WebKit</h1>

    <section class="card">
      <h2>Talk to C</h2>
      <form id="greet">
        <input id="name" placeholder="Your name" autocomplete="off" required>
        <button type="submit">Send</button>
      </form>
      <p id="reply" class="muted">No reply yet.</p>
    </section>

    <section class="card">
      <h2>Counter</h2>
      <div class="row">
        <button id="dec">−</button>
        <span id="count">0</span>
        <button id="inc">+</button>
      </div>
    </section>

    <footer id="info" class="muted">Loading…</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
