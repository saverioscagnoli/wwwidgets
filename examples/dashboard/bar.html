<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>bar</title>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
    }

    #clock {
      margin-right: auto;
    }

    #dnd {
      color: var(--dim);
    }

    #dnd[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <span id="clock"></span>
  <span id="dnd" hidden>dnd</span>
  <button id="volume">vol ?</button>
  <button id="menu">menu</button>

  <script type="module">
    const clock = document.getElementById("clock");
    const dnd = document.getElementById("dnd");
    const volume = document.getElementById("volume");
    const menu = document.getElementById("menu");
    let open = false;
    let sink;

    const tick = () => {
      clock.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    };

    tick();
    setInterval(tick, 1000);

    wwwidgets.audio.onChange(({ default: id, sinks }) => {
      sink = sinks.find((s) => s.id === id);

      if (!sink) volume.textContent = "vol ?";
      else volume.textContent = sink.muted ? "muted" : `vol ${Math.round(sink.volume * 100)}%`;
    });

    wwwidgets.state.onChange("ui.dnd", (on) => {
      dnd.hidden = !on;
    });

    wwwidgets.state.onChange("control.open", (v) => {
      open = v;
      menu.classList.toggle("on", v);
    });

    volume.onclick = () => sink && wwwidgets.audio.setMute(sink.id, !sink.muted);

    volume.onwheel = (e) => {
      if (!sink) return;

      const step = e.deltaY < 0 ? 0.05 : -0.05;
      wwwidgets.audio.setVolume(sink.id, Math.min(Math.max(sink.volume + step, 0), 1));
    };

    menu.onclick = () => wwwidgets.state.set("control.open", !open);
  </script>
</body>
</html>
