<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>audio</title>
</head>
<body>
  <script type="module">
    wwwidgets.window.hide();

    const sink = "@DEFAULT_AUDIO_SINK@";
    let holdUntil = 0;
    let reading = false;
    let again = false;
    let timer;

    const read = async () => {
      if (reading) {
        again = true;
        return;
      }

      reading = true;

      do {
        again = false;

        const { stdout } = await wwwidgets.exec(["wpctl", "get-volume", sink]);
        const match = stdout.match(/([\d.]+)/);
        if (!match) continue;

        if (Date.now() < holdUntil) {
          schedule();
          continue;
        }

        wwwidgets.state.set("audio", {
          volume: Math.round(parseFloat(match[1]) * 100),
          muted: stdout.includes("MUTED"),
        });
      } while (again);

      reading = false;
    };

    const schedule = () => {
      clearTimeout(timer);
      const wait = holdUntil - Date.now();

      if (wait > 0) timer = setTimeout(schedule, wait);
      else read();
    };

    wwwidgets.state.onChange("audio", () => {
      holdUntil = Date.now() + 300;
      schedule();
    });

    await wwwidgets.spawn(["pactl", "subscribe"], {
      onStdout: (line) => {
        if (line.includes("sink")) schedule();
      },
    });

    await read();
  </script>
</body>
</html>
