<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>wifi</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100vh;
      background: transparent;
      overflow: hidden;
    }

    body {
      font: 13px monospace;
      color: #cdd6f4;
      user-select: none;
    }

    #panel {
      height: 100%;
      padding: 12px;
      background: #1e1e2e;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    header strong {
      margin-right: auto;
    }

    button {
      padding: 4px 10px;
      font: inherit;
      color: inherit;
      background: #313244;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #45475a;
    }

    button.on,
    button.primary {
      background: #89b4fa;
      color: #1e1e2e;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #status {
      color: #7f849c;
    }

    #status.connected {
      color: #a6e3a1;
    }

    #status.portal,
    #status.limited {
      color: #f9e2af;
    }

    #list {
      flex: 1;
      margin: 0;
      padding: 0;
      list-style: none;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    li {
      height: 34px;
      padding: 0 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    li:hover {
      background: #313244;
    }

    li.active .ssid {
      color: #a6e3a1;
    }

    li.busy {
      opacity: 0.5;
      cursor: default;
    }

    .bars {
      width: 16px;
      height: 12px;
      display: flex;
      align-items: flex-end;
      gap: 1px;
    }

    .bars span {
      flex: 1;
      background: #45475a;
      border-radius: 1px;
    }

    .bars span.lit {
      background: #cdd6f4;
    }

    .ssid {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tag {
      color: #7f849c;
      font-size: 11px;
    }

    li button {
      padding: 2px 8px;
    }

    #empty {
      color: #7f849c;
      text-align: center;
      padding: 16px 0;
    }

    #prompt {
      padding: 10px;
      background: #313244;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #password {
      padding: 4px 8px;
      font: inherit;
      color: inherit;
      background: #1e1e2e;
      border: 1px solid #45475a;
      border-radius: 6px;
      outline: none;
    }

    #password:focus {
      border-color: #89b4fa;
    }

    #prompt-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #prompt-actions label {
      margin-right: auto;
      color: #7f849c;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #prompt-actions button {
      background: #45475a;
    }

    #prompt-actions button.primary {
      background: #89b4fa;
      color: #1e1e2e;
    }

    #error {
      min-height: 1em;
      color: #f38ba8;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="panel">
    <header>
      <strong>wifi</strong>
      <button id="scan">scan</button>
      <button id="power">off</button>
    </header>

    <span id="status"></span>

    <ul id="list"></ul>
    <span id="empty" hidden></span>

    <div id="prompt" hidden>
      <span id="prompt-text"></span>
      <input id="password" type="password" autocomplete="off">
      <div id="prompt-actions">
        <label><input id="show" type="checkbox">show</label>
        <button id="cancel">cancel</button>
        <button id="join" class="primary">join</button>
      </div>
    </div>

    <span id="error"></span>
  </div>

  <script type="module">
    const nm = wwwidgets.network;
    const $ = (id) => document.getElementById(id);
    const busy = new Set();
    let state = { networks: [], devices: [] };
    let asking = null;
    let scanning = false;

    const statusText = (s) => {
      if (!s.wifiHardwareEnabled) return "wifi is blocked by a hardware switch";
      if (!s.wifiEnabled) return "wifi is off";

      const active = s.networks.find((n) => n.active);
      const wifi = s.devices.find((d) => d.type === "wifi");

      if (wifi?.state === "connecting") return "connecting…";
      if (!active) return "not connected";
      if (s.connectivity === "portal") return `${active.ssid} · sign in required`;
      if (s.connectivity === "limited" || s.connectivity === "none") return `${active.ssid} · no internet`;
      return `connected to ${active.ssid}`;
    };

    const run = async (id, action) => {
      busy.add(id);
      $("error").textContent = "";
      render();

      try {
        await action();
      } catch (e) {
        $("error").textContent = e.message;
      } finally {
        busy.delete(id);
        render();
      }
    };

    const button = (label, onclick) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = (e) => {
        e.stopPropagation();
        onclick();
      };
      return b;
    };

    const bars = (strength) => {
      const el = document.createElement("span");
      el.className = "bars";
      const level = strength >= 75 ? 4 : strength >= 50 ? 3 : strength >= 25 ? 2 : 1;

      for (let i = 1; i <= 4; i++) {
        const bar = document.createElement("span");
        bar.style.height = `${i * 25}%`;
        bar.classList.toggle("lit", i <= level);
        el.append(bar);
      }

      return el;
    };

    const ask = (network) => {
      asking = network;
      $("prompt-text").textContent = `Password for ${network.ssid}`;
      $("password").value = "";
      $("password").type = "password";
      $("show").checked = false;
      $("prompt").hidden = false;
      wwwidgets.window.setKeyboard("on-demand");
      $("password").focus();
    };

    const closePrompt = () => {
      asking = null;
      $("prompt").hidden = true;
      wwwidgets.window.setKeyboard("none");
    };

    const join = () => {
      if (!asking) return;
      const network = asking;
      const password = $("password").value;
      closePrompt();
      run(network.id, () => nm.connect(network.id, password));
    };

    const select = (n) => {
      if (busy.has(n.id) || n.active) return;
      if (n.secure && !n.known) return ask(n);
      run(n.id, () => nm.connect(n.id));
    };

    const row = (n) => {
      const li = document.createElement("li");
      li.classList.toggle("active", n.active);
      li.classList.toggle("busy", busy.has(n.id));
      li.title = `${(n.frequency / 1000).toFixed(1)} GHz · ${n.strength}%`;
      li.onclick = () => select(n);

      const ssid = document.createElement("span");
      ssid.className = "ssid";
      ssid.textContent = n.ssid;

      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = [n.known && "saved", n.secure && "🔒"].filter(Boolean).join(" ");

      li.append(bars(n.strength), ssid, tag);

      if (busy.has(n.id)) return li;

      if (n.active) {
        li.append(button("disconnect", () => run(n.id, () => nm.disconnect(n.device))));
      }

      if (n.known) {
        li.append(button("x", () => run(n.id, () => nm.forget(n.ssid))));
      }

      return li;
    };

    const render = () => {
      const s = state;
      const enabled = s.wifiEnabled && s.wifiHardwareEnabled;
      const connected = s.networks.some((n) => n.active);

      $("power").textContent = s.wifiEnabled ? "on" : "off";
      $("power").classList.toggle("on", s.wifiEnabled);
      $("power").disabled = !s.wifiHardwareEnabled;
      $("scan").disabled = !enabled || scanning;
      $("scan").textContent = scanning ? "scanning" : "scan";

      $("status").textContent = statusText(s);
      $("status").className = connected ? (s.connectivity === "full" ? "connected" : s.connectivity) : "";

      const networks = enabled ? s.networks : [];
      $("list").replaceChildren(...networks.map(row));
      $("empty").hidden = networks.length > 0;
      $("empty").textContent = enabled ? "no networks found" : "";

      if (asking && !networks.some((n) => n.id === asking.id)) closePrompt();
    };

    const scan = async () => {
      scanning = true;
      render();

      try {
        await nm.scan();
      } catch (e) {
        $("error").textContent = e.message;
      }

      setTimeout(() => {
        scanning = false;
        render();
      }, 3000);
    };

    nm.onChange((s) => {
      const wasEnabled = state.wifiEnabled;
      state = s;
      render();
      if (s.wifiEnabled && wasEnabled === false) scan();
    });

    $("power").onclick = () => run("power", () => nm.setWifiEnabled(!state.wifiEnabled));
    $("scan").onclick = scan;
    $("join").onclick = join;
    $("cancel").onclick = closePrompt;
    $("show").onchange = () => ($("password").type = $("show").checked ? "text" : "password");
    $("password").onkeydown = (e) => {
      if (e.key === "Enter") join();
      if (e.key === "Escape") closePrompt();
    };

    nm.get().then((s) => s?.wifiEnabled && scan());
  </script>
</body>
</html>
