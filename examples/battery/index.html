<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>battery</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100vh;
      background: transparent;
      overflow: hidden;
    }

    body {
      font: 13px monospace;
      color: #cdd6f4;
      user-select: none;
    }

    #card {
      --level: #a6e3a1;
      height: 100%;
      padding: 14px 16px;
      background: #1e1e2e;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #card.low {
      --level: #f9e2af;
    }

    #card.critical {
      --level: #f38ba8;
    }

    #card.critical #percent {
      animation: pulse 1s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      to {
        opacity: 0.4;
      }
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    #percent {
      font-size: 32px;
      font-weight: bold;
      color: var(--level);
    }

    #state {
      margin-left: auto;
      color: #7f849c;
    }

    #track {
      height: 8px;
      background: #313244;
      border-radius: 4px;
      overflow: hidden;
    }

    #fill {
      height: 100%;
      width: 0;
      background: var(--level);
      transition: width 400ms ease, background 400ms;
    }

    #card.charging #fill {
      background-image: linear-gradient(90deg, transparent 0 40%, #ffffff40 50%, transparent 60% 100%);
      background-size: 200% 100%;
      animation: flow 1.6s linear infinite;
    }

    @keyframes flow {
      from {
        background-position: 100% 0;
      }
      to {
        background-position: -100% 0;
      }
    }

    footer {
      display: flex;
      justify-content: space-between;
      color: #a6adc8;
    }

    #empty {
      height: 100%;
      background: #1e1e2e;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7f849c;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="card" hidden>
    <header>
      <span id="percent"></span>
      <span id="state"></span>
    </header>
    <div id="track"><div id="fill"></div></div>
    <footer>
      <span id="time"></span>
      <span id="rate"></span>
    </footer>
  </div>

  <div id="empty" hidden>no battery</div>

  <script type="module">
    const $ = (id) => document.getElementById(id);

    const labels = {
      charging: "charging",
      discharging: "on battery",
      empty: "empty",
      full: "full",
      "pending-charge": "plugged in",
      "pending-discharge": "plugged in",
      unknown: "",
    };

    const duration = (s) => {
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m`;
    };

    wwwidgets.battery.onChange((b) => {
      $("card").hidden = !b.present;
      $("empty").hidden = b.present;
      if (!b.present) return;

      const percent = Math.round(b.percentage);
      const charging = b.state === "charging";

      $("percent").textContent = `${percent}%`;
      $("state").textContent = labels[b.state] ?? b.state;
      $("fill").style.width = `${percent}%`;

      $("card").classList.toggle("charging", charging);
      $("card").classList.toggle("low", b.warning === "low");
      $("card").classList.toggle("critical", b.warning === "critical" || b.warning === "action");

      if (charging && b.timeToFull) $("time").textContent = `${duration(b.timeToFull)} to full`;
      else if (!charging && b.timeToEmpty) $("time").textContent = `${duration(b.timeToEmpty)} left`;
      else $("time").textContent = b.onBattery ? "estimating…" : "on ac";

      $("rate").textContent = b.energyRate > 0 ? `${b.energyRate.toFixed(1)} W` : "";
    });
  </script>
</body>
</html>
